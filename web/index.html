            var retryDelay = reconnectDelayMs(networkRetryCount);
            window.clearTimeout(networkRetryTimer);
            networkRetryTimer = window.setTimeout(function() {
              if (!hls || !video) return;
              if (networkRetryCount > 4) {
                rebuildPlayer('repeated fatal network errors');
                return;
              }
              hls.stopLoad();
              hls.startLoad(-1);
              if (video.paused) {
                video.play().catch(function() {});
              }
            }, retryDelay);
            window.visionnaireHlsTimers[elementId].push(networkRetryTimer);
          } else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
            mediaRetryCount += 1;
            markReconnecting('重新連線中');
            var mediaRetryDelay = reconnectDelayMs(mediaRetryCount);
            window.clearTimeout(mediaRetryTimer);
            mediaRetryTimer = window.setTimeout(function() {

              if (mediaRetryCount > 4) {

                return;

        var nativeRetryTimer = null;
        var reloadNativeHls = function(reason) {
          nativeRetryCount += 1;
          markReconnecting('重新連線中');
          var retryDelay = reconnectDelayMs(nativeRetryCount);
          window.clearTimeout(nativeRetryTimer);
          nativeRetryTimer = window.setTimeout(function() {
            if (!video) return;
            if (nativeRetryCount > 4) {
              rebuildPlayer('repeated native HLS errors');
              return;
            }
            video.pause();
            video.src = url;
            video.load();
            video.play().catch(function() {});

          window.visionnaireHlsTimers[elementId].push(nativeRetryTimer);

          var rangeIndex = video.seekable.length - 1;
          var liveEdge = video.seekable.end(rangeIndex);
          var rangeStart = video.seekable.start(rangeIndex);
          if (!Number.isFinite(liveEdge) || liveEdge <= 0) return;
          var targetPosition = Math.max(rangeStart, liveEdge - targetLiveLatencySeconds);
          if (targetPosition - video.currentTime > liveLatencyToleranceSeconds) {
            video.currentTime = targetPosition;
          }

        var nativeLiveEdgeTimer = window.setInterval(function() {
          if (video.paused) return;
          seekNativeToLiveEdge();
        }, 2000);
        window.visionnaireHlsTimers[elementId].push(nativeLiveEdgeTimer);
        var onNativeError = function() {
          reloadNativeHls('native video error');
        };
        var onNativePlaying = function() {
          nativeRetryCount = 0;
          markPlaying();
          seekNativeToLiveEdge();
        };
        var onNativeWaiting = function() {
          window.setTimeout(function() {
            if (!video.paused && video.readyState < 3) {
              reloadNativeHls('native video waiting');
            }
          }, 10000);
        };
        video.addEventListener('error', onNativeError);
        video.addEventListener('playing', onNativePlaying);
        video.addEventListener('stalled', onNativeWaiting);
        video.addEventListener('waiting', onNativeWaiting);
        window.visionnaireHlsCleanups[elementId].push(function() {
          video.removeEventListener('error', onNativeError);
          video.removeEventListener('playing', onNativePlaying);
          video.removeEventListener('stalled', onNativeWaiting);
          video.removeEventListener('waiting', onNativeWaiting);
        });
        video.play().catch(function() {});
      }
    };

    window.visionnaireHlsWalls = window.visionnaireHlsWalls || {};

    window.visionnaireDisposeHlsWallById = function(wallId) {
      if (!wallId) return;
      var state = window.visionnaireHlsWalls[wallId];
      if (state && state.videoIds) {
        Object.keys(state.videoIds).forEach(function(videoId) {
          window.visionnaireDisposeHlsById(videoId);
        });
      }
      var root = document.getElementById(wallId);
      if (root) {
        root.textContent = '';
      }
      delete window.visionnaireHlsWalls[wallId];
    };

    window.visionnaireUpdateHlsWallById = function(wallId, configJson, headersJson) {
      if (!wallId || !configJson) return;
      var root = document.getElementById(wallId);
      if (!root) return;
      if (window.visionnaireSetHlsAuthHeaders) {
        window.visionnaireSetHlsAuthHeaders(headersJson || '');
      }

      var config = {};
      try {
        config = JSON.parse(configJson) || {};
      } catch (e) {
        return;
      }

      var columns = Math.max(1, parseInt(config.columns || 1, 10));
      var tiles = Array.isArray(config.tiles) ? config.tiles : [];
      var dividerColor = config.dividerColor || '#4A4A4A';
      var warningColor = config.warningColor || '#B3261E';
      var state = window.visionnaireHlsWalls[wallId] || { videoIds: {} };
      var seenSlotIds = {};

      root.style.display = 'grid';
      root.style.gridTemplateColumns = 'repeat(' + columns + ', minmax(0, 1fr))';
      root.style.gridAutoRows = '1fr';
      root.style.gap = '0';
      root.style.width = '100%';
      root.style.height = '100%';
      root.style.overflow = 'hidden';
      root.style.background = '#0d0d11';

      var safeSlotId = function(value, index) {
        var text = (value || '').toString().trim();
        if (!text) text = 'slot-' + index;
        return text.replace(/[^a-zA-Z0-9_-]/g, '_');
      };
      var placeCellAt = function(cell, index) {
        var currentAtIndex = root.children[index] || null;
        if (cell.parentNode !== root) {
          root.insertBefore(cell, currentAtIndex);
          return;
        }
        if (currentAtIndex && currentAtIndex !== cell) {
          root.insertBefore(cell, currentAtIndex);
        }
      };
      var ensureDiv = function(parent, role) {
        var node = parent.querySelector('[data-role="' + role + '"]');
        if (!node) {
          node = document.createElement('div');
          node.setAttribute('data-role', role);
          parent.appendChild(node);
        }
        return node;
      };
      var setBadgeStyle = function(node, position) {
        node.style.position = 'absolute';
        node.style.top = '6px';
        node.style.boxSizing = 'border-box';
        node.style.padding = position === 'left' ? '4px 7px' : '5px 8px';
        node.style.borderRadius = '4px';
        node.style.border = '1px solid rgba(255,255,255,0.10)';
        node.style.background = 'rgba(0,0,0,0.48)';
        node.style.color = 'white';
        node.style.font = position === 'left'
          ? '800 10px system-ui, -apple-system, sans-serif'
          : '800 13px system-ui, -apple-system, sans-serif';
        node.style.whiteSpace = 'nowrap';
        node.style.overflow = 'hidden';
        node.style.textOverflow = 'ellipsis';
        node.style.pointerEvents = 'none';
        node.style.maxWidth = position === 'left' ? '42%' : '56%';
        if (position === 'left') {
          node.style.left = '6px';
          node.style.right = '';
        } else {
          node.style.left = '';
          node.style.right = '6px';
        }
      };

      tiles.forEach(function(tile, index) {
        var slotId = safeSlotId(tile.slotId, index);
        var slotKey = (tile.slotKey || slotId).toString();
        seenSlotIds[slotId] = true;

        var cellId = wallId + '-cell-' + slotId;
        var videoId = wallId + '-video-' + slotId;
        var cell = document.getElementById(cellId);
        if (!cell) {
          cell = document.createElement('div');
          cell.id = cellId;
          cell.style.position = 'relative';
          cell.style.overflow = 'hidden';
          cell.style.background = '#0d0d11';
          cell.style.boxSizing = 'border-box';
          cell.style.cursor = 'pointer';
          cell.addEventListener('click', function() {
            window.dispatchEvent(new CustomEvent('visionnaire-hls-wall-tap', {
              detail: {
                wallId: wallId,
                slotKey: cell.getAttribute('data-slot-key') || ''
              }
            }));
          });
        }
        cell.setAttribute('data-slot-id', slotId);
        cell.setAttribute('data-slot-key', slotKey);
        cell.style.border = '1px solid ' + (tile.hasWarning ? warningColor : dividerColor);
        cell.style.boxShadow = tile.hasWarning
          ? 'inset 0 0 0 4px ' + warningColor
          : 'none';
        cell.style.zIndex = tile.hasWarning ? '2' : '0';
        cell.style.transition = 'border-color 120ms ease, box-shadow 120ms ease';
        placeCellAt(cell, index);

        var placeholder = ensureDiv(cell, 'placeholder');
        placeholder.style.position = 'absolute';
        placeholder.style.inset = '0';
        placeholder.style.display = 'flex';
        placeholder.style.alignItems = 'center';
        placeholder.style.justifyContent = 'center';
        placeholder.style.color = 'rgba(255,255,255,0.82)';
        placeholder.style.font = '700 13px system-ui, -apple-system, sans-serif';
        placeholder.style.letterSpacing = '0.02em';
        placeholder.style.background = '#0d0d11';
        placeholder.textContent = '重新連線中';

        var stateBadge = ensureDiv(cell, 'state');
        setBadgeStyle(stateBadge, 'left');
        var titleBadge = ensureDiv(cell, 'title');
        setBadgeStyle(titleBadge, 'right');

        var overlayIndex = (tile.overlayIndex || '').toString().trim();
        var overlayStatus = (tile.overlayStatus || '').toString().trim();
        var stateText = [overlayIndex, overlayStatus].filter(Boolean).join(' ');
        stateBadge.textContent = stateText ? '● ' + stateText : '';
        stateBadge.style.display = stateText ? 'block' : 'none';
        stateBadge.style.color = tile.overlayStatusColor || '#21d18b';

        var title = (tile.title || '').toString().trim();
        titleBadge.textContent = title ? '▸ ' + title : '';
        titleBadge.style.display = title ? 'block' : 'none';

        if (tile.isPlayable && tile.playbackUrl) {
          var video = document.getElementById(videoId);
          if (!video) {
            video = document.createElement('video');
            video.id = videoId;
            video.setAttribute('crossorigin', 'use-credentials');
            video.autoplay = true;
            video.muted = true;
            video.playsInline = true;
            video.preload = 'none';
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'contain';
            video.style.backgroundColor = 'black';
            video.style.display = 'block';
            cell.insertBefore(video, cell.firstChild);
          }
          var hasFirstFrame = video.getAttribute('data-hls-has-frame') === 'true';
          placeholder.textContent = hasFirstFrame ? '' : '重新連線中';
          placeholder.style.display = hasFirstFrame ? 'none' : 'flex';
          state.videoIds[videoId] = true;
          var activePlaybackUrl =
            window.visionnaireHlsSources[videoId] ||
            video.getAttribute('data-hls-url') ||
            '';
          var pendingPlaybackUrl =
            video.getAttribute('data-hls-pending-url') || '';
          var needsAttach =
            activePlaybackUrl !== tile.playbackUrl ||
            !window.visionnaireHlsInstances[videoId];
          if (needsAttach && pendingPlaybackUrl !== tile.playbackUrl) {
            video.removeAttribute('data-hls-has-frame');
            placeholder.textContent = '重新連線中';
            placeholder.style.display = 'flex';
            video.setAttribute('data-hls-pending-url', tile.playbackUrl);
            window.visionnaireAttachHlsById(
              videoId,
              tile.playbackUrl,
              headersJson || '',
              false
            );
          } else if (!needsAttach && pendingPlaybackUrl) {
            video.removeAttribute('data-hls-pending-url');
          }
        } else {
          placeholder.textContent = '▶';
          placeholder.style.color = '#5B5BD6';
          placeholder.style.font = '600 38px system-ui, -apple-system, sans-serif';
          placeholder.style.display = 'flex';
          if (state.videoIds[videoId]) {
            window.visionnaireDisposeHlsById(videoId);
            delete state.videoIds[videoId];
          }
          var staleVideo = document.getElementById(videoId);
          if (staleVideo && staleVideo.parentNode) {
            staleVideo.parentNode.removeChild(staleVideo);
          }
        }
      });

      Array.prototype.slice.call(root.children).forEach(function(cell) {
        var slotId = cell.getAttribute && cell.getAttribute('data-slot-id');
        if (!slotId || seenSlotIds[slotId]) return;
        var videoId = wallId + '-video-' + slotId;
        window.visionnaireDisposeHlsById(videoId);
        delete state.videoIds[videoId];
        root.removeChild(cell);
      });

      window.visionnaireHlsWalls[wallId] = state;
    };
  </script>
