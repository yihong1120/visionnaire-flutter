name: Bug report
description: Report a reproducible problem in the public Flutter client.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include activation codes, credentials, customer data, production URLs, or captured media.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction steps
      placeholder: Use a safe, non-production configuration.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Flutter and app version
    validations:
      required: true
