name: Flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public-source hygiene
        run: ./scripts/verify_public_source.sh

      - name: Set up Flutter
        shell: bash
        run: |
          flutter_archive="$RUNNER_TEMP/flutter_linux_3.47.0-stable.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$flutter_archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.0-stable.tar.xz"
          echo "26cd99d3d94b1367e6b50535a18aeef0282c10a535bbe3ec493534dcdab75296  $flutter_archive" \
            | sha256sum --check --strict
          tar -xf "$flutter_archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Use runner JDK 17 for Android
        shell: bash
        run: |
          if [[ -z "${JAVA_HOME_17_X64:-}" || ! -x "$JAVA_HOME_17_X64/bin/java" ]]; then
            echo "::error::The GitHub runner does not provide the required JDK 17."
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version

      - name: Provide non-production Firebase options
        run: |
          cp lib/firebase_options.example.dart lib/firebase_options.dart
          cp android/app/google-services.example.json android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Web with public configuration
        run: |
          cp .env.social.example.json .env.social.prod.json
          ./scripts/flutter_with_env.sh build web --release --no-wasm-dry-run

      - name: Build Android debug APK
        run: ./scripts/flutter_with_env.sh build apk --debug
